name: "Validate"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"  # Tägliche Überprüfung um Mitternacht UTC
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

permissions: {}

jobs:
  hassfest: # Validierung für Home Assistant Integrationen
    name: "Hassfest Validation"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v4"

      - name: "Run hassfest validation"
        uses: "home-assistant/actions/hassfest@master"

  hacs: # HACS-spezifische Validierung
    name: "HACS Validation"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v4"

      - name: "Run HACS validation"
        uses: "hacs/action@main"
        with:
          category: "integration"
          # Benutzerdefiniertes Repository: Die nichtkommerzielle Lizenz erfüllt die OSI-Vorgabe des Standardkatalogs nicht.
          ignore: "brands license"
