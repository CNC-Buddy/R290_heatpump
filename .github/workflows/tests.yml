name: Regression tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pymodbus: ["3.10.0", "3.16.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install "pymodbus==${{ matrix.pymodbus }}"
      - run: python -m unittest discover -s tests -v
      - run: python tests/proxy_transport_checks.py
