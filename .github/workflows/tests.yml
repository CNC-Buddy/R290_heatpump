name: Regression tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pymodbus: ["3.10.0", "3.16.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install "pymodbus==${{ matrix.pymodbus }}" openpyxl
      - run: python -m unittest discover -s tests -v
      - run: python tests/proxy_transport_checks.py
      - run: python tests/polling_simulation.py
        if: matrix.pymodbus == '3.16.1'
      - uses: actions/upload-artifact@v4
        if: matrix.pymodbus == '3.16.1'
        with:
          name: nextgen-simulation
          path: artifacts/nextgen-simulation.json

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tests/create_diagnosis_fixture.py
      - run: python scripts/build_register_diagnosis.py
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check UI and translations
        shell: bash
        run: |
          export CHROMIUM_EXECUTABLE="$(node -e 'console.log(require("playwright").chromium.executablePath())')"
          npm run test:ui
